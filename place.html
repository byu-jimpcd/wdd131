<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Country</title>
    <meta name="author" content="Jim Cueva">
    <meta name="description"
        content="Week 03 Assignment, the subject of the page is a country or place where you live, have visited, or wish to visit">
    <link rel="stylesheet" href="styles/place.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100&display=swap" rel="stylesheet">
    <script src="scripts/getdates.js" defer></script>
    <script src="scripts/place.js" defer></script>

</head>

<body>

    <header>
        <h1>Peru</h1>
    </header>

    <main>

        <div class="hero">

            <picture>
                <source srcset="images/hero-large.webp" media="(min-width: 1000px)">
                <img src="images/hero-small.webp" alt="Representative image of Peru" width="500" height="250">
            </picture>



            <div class="data">

                <h2>Data</h2>

                <dl>

                    <dt>Area:</dt>
                    <dd>1,285,216 sq km</dd>

                    <dt>Population:</dt>
                    <dd>35,000,000</dd>

                    <dt>Capital:</dt>
                    <dd>Lima</dd>

                    <dt>Languages:</dt>
                    <dd>Spanish, Quechua and Aymara</dd>

                    <dt>Currency:</dt>
                    <dd>Peruvian Sol</dd>

                    <dt>Time Zone:</dt>
                    <dd>GMT-5</dd>

                    <dt>Calling Code:</dt>
                    <dd>+51</dd>

                    <dt>Internet TLD:</dt>
                    <dd>.pe</dd>

                </dl>


            </div>

            <div class="weather">

                <h2>Weather</h2>

                <img src="images/weather.svg" alt="Weather icon">

                <dl>

                    <dt>Temperature:</dt>
                    <dd>15°C</dd>

                    <dt>Conditions:</dt>
                    <dd>Partly sunny</dd>

                    <dt>Wind:</dt>
                    <dd>6 km/h</dd>

                    <dt>Wind Chill:</dt>
                    <dd id="windchill"></dd>

                </dl>

            </div>

        </div>

    </main>


    <footer>

        <p>©️ || <span id="currentyear"></span> || Jim Cueva || Cusco, Perú</p>

        <p id="lastModified"></p>

    </footer>

</body>

</html>
