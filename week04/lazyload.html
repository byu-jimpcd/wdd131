<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazy Load Demonstration</title>
    <meta name="author" content="Jim Cueva">
    <meta name="description" content="Lazy Load Activity of week 04">
    <link rel="stylesheet" href="styles/lazyload.css">
</head>
<body>

    <header>
        <h1>Lazy Load Demonstration</h1>
    </header>

    <main>
        <picture>
            <img src="https://picsum.photos/400/600" alt="Random Image" loading="lazy" width="400" height="600">
        </picture>
        <picture>
            <img src="https://picsum.photos/400/700" alt="Random Image" loading="lazy" width="400" height="600">
        </picture>
        <picture>
            <img src="https://picsum.photos/400/800" alt="Random Image" loading="lazy" width="400" height="600">
        </picture>
        <picture>
            <img src="https://picsum.photos/400/650" alt="Random Image" loading="lazy" width="400" height="600">
        </picture>
        <picture>
            <img src="https://picsum.photos/400/750" alt="Random Image" loading="lazy" width="400" height="600">
        </picture>
        <picture>
            <img src="https://picsum.photos/400/850" alt="Random Image" loading="lazy" width="400" height="600">
        </picture>
    </main>
    
</body>
</html>
